<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jingles Lula — Ouça e baixe</title>
<meta name="description" content="Ouça e baixe os jingles do 13." />"
<meta name="description" content="Músicas"
<meta name="theme-color" content="#062a14" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f5132'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='bold' text-anchor='middle' fill='%23ffd60a'%3E13%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- fundo decorativo -->
<div class="bg" aria-hidden="true">
  <span class="blob blob--1"></span>
  <span class="blob blob--2"></span>
  <span class="blob blob--3"></span>
  <div class="grain"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand__mark">13</span>
    <span class="brand__name">Jingles Lula</span>
  </div>
  <span class="brand__tag">Ouça &amp; baixe</span>
</header>

<main>
  <section class="hero">
    <p class="hero__kicker">Aperte o play</p>
    <h1 class="hero__title">Os jingles do <span class="hl">13</span></h1>
    <p class="hero__sub">Escolha um jingle, ouca e baixe.</p>

    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
      </svg>
      <input id="search" type="search" placeholder="Buscar jingle..." aria-label="Buscar jingle" autocomplete="off" />
    </div>
  </section>

  <section class="grid" id="grid" aria-label="Lista de jingles"></section>

  <p class="empty" id="empty" hidden>
    <span aria-hidden="true">🎺</span> Nenhum jingle encontrado.
  </p>
</main>

<footer class="footer">
  <span>Feito para a militância <span class="hl">💚💛</span></span>
</footer>

<!-- player fixo -->
<div class="player" id="player" hidden>
  <button class="player__toggle" id="playerToggle" type="button" aria-label="Reproduzir ou pausar">
    <svg class="ic ic--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
    <svg class="ic ic--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z" /></svg>
  </button>

  <div class="player__meta">
    <strong class="player__title" id="playerTitle">—</strong>
    <span class="player__line"><i id="playerFill"></i></span>
  </div>

  <a class="player__dl" id="playerDl" href="#" download aria-label="Baixar jingle">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 19h14" /></svg>
  </a>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
